<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:include="include :: header('修改工作组物理位置坐标')"/>
</head>
<body class="white-bg">
<div class="wrapper wrapper-content animated fadeInRight ibox-content">
    <form class="form-horizontal m" id="form-location-edit" th:object="${workgroupLocation}">
        <input name="id" th:field="*{id}" type="hidden">
        <div class="col-xs-12">
            <div class="form-group">
                <label class="col-sm-3 control-label is-required">工作组名称
                    ：</label>
                <div class="col-sm-8">
                    <input class="form-control" name="workgroupName" required
                           th:field="*{workgroupName}" type="text">
                </div>
            </div>
        </div>
        <div class="col-xs-12">
            <div class="form-group">
                <label class="col-sm-3 control-label is-required">横坐标
                    ：</label>
                <div class="col-sm-8">
                    <input class="form-control" name="coordX" required
                           th:field="*{coordX}" type="text">
                </div>
            </div>
        </div>
        <div class="col-xs-12">
            <div class="form-group">
                <label class="col-sm-3 control-label is-required">纵坐标
                    ：</label>
                <div class="col-sm-8">
                    <input class="form-control" name="coordY" required
                           th:field="*{coordY}" type="text">
                </div>
            </div>
        </div>
    </form>
</div>
<th:block th:include="include :: footer"/>
<script th:inline="javascript">
    var prefix = ctx + "system/location";
    $("#form-location-edit").validate({
        focusCleanup: true
    });

    function submitHandler() {
        if ($.validate.form()) {
            $.operate.save(prefix + "/edit", $('#form-location-edit').serialize());
        }
    }
</script>
</body>
</html>
