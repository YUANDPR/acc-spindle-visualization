<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:include="include :: header('修改工作组间关系一维化')"/>
</head>
<body class="white-bg">
<div class="wrapper wrapper-content animated fadeInRight ibox-content">
    <form class="form-horizontal m" id="form-relations-edit" th:object="${workflowRelations}">
        <input name="id" th:field="*{id}" type="hidden">
        <div class="col-xs-12">
            <div class="form-group">
                <label class="col-sm-3 control-label is-required">源工作组
                    ：</label>
                <div class="col-sm-8">
                    <input class="form-control" name="sourceWorkgroup" required
                           th:field="*{sourceWorkgroup}" type="text">
                </div>
            </div>
        </div>
        <div class="col-xs-12">
            <div class="form-group">
                <label class="col-sm-3 control-label is-required">目标工作组
                    ：</label>
                <div class="col-sm-8">
                    <input class="form-control" name="targetWorkgroup" required
                           th:field="*{targetWorkgroup}" type="text">
                </div>
            </div>
        </div>
        <div class="col-xs-12">
            <div class="form-group">
                <label class="col-sm-3 control-label is-required">关系数值
                    ：</label>
                <div class="col-sm-8">
                    <input class="form-control" name="relationValue" required
                           th:field="*{relationValue}" type="text">
                </div>
            </div>
        </div>
    </form>
</div>
<th:block th:include="include :: footer"/>
<script th:inline="javascript">
    var prefix = ctx + "system/relations";
    $("#form-relations-edit").validate({
        focusCleanup: true
    });

    function submitHandler() {
        if ($.validate.form()) {
            $.operate.save(prefix + "/edit", $('#form-relations-edit').serialize());
        }
    }
</script>
</body>
</html>
