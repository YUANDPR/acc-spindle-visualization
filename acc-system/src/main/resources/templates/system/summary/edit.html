<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:include="include :: header('修改工单工艺流程流转总距离汇总')"/>
    <th:block th:include="include :: datetimepicker-css"/>
</head>
<body class="white-bg">
<div class="wrapper wrapper-content animated fadeInRight ibox-content">
    <form class="form-horizontal m" id="form-summary-edit" th:object="${workorderDistanceSummary}">
        <input name="id" th:field="*{id}" type="hidden">
        <div class="col-xs-12">
            <div class="form-group">
                <label class="col-sm-3 control-label">工单物料号
                    ：</label>
                <div class="col-sm-8">
                    <input class="form-control" name="materialId" th:field="*{materialId}"
                           type="text">
                </div>
            </div>
        </div>
        <div class="col-xs-12">
            <div class="form-group">
                <label class="col-sm-3 control-label is-required">总曼哈顿距离
                    ：</label>
                <div class="col-sm-8">
                    <input class="form-control" name="totalManhattanDistance" required
                           th:field="*{totalManhattanDistance}" type="text">
                </div>
            </div>
        </div>
        <div class="col-xs-12">
            <div class="form-group">
                <label class="col-sm-3 control-label">计算时间
                    ：</label>
                <div class="col-sm-8">
                    <div class="input-group date">
                        <input class="form-control"
                               name="calcTime"
                               placeholder="yyyy-MM-dd" th:value="${#dates.format(workorderDistanceSummary.calcTime, 'yyyy-MM-dd')}" type="text">
                        <span class="input-group-addon"><i class="fa fa-calendar"></i></span>
                    </div>
                </div>
            </div>
        </div>
    </form>
</div>
<th:block th:include="include :: footer"/>
<th:block th:include="include :: datetimepicker-js"/>
<script th:inline="javascript">
    var prefix = ctx + "system/summary";
    $("#form-summary-edit").validate({
        focusCleanup: true
    });

    function submitHandler() {
        if ($.validate.form()) {
            $.operate.save(prefix + "/edit", $('#form-summary-edit').serialize());
        }
    }

    $("input[name='calcTime']").datetimepicker({
        format: "yyyy-mm-dd",
        minView: "month",
        autoclose: true
    });
</script>
</body>
</html>
