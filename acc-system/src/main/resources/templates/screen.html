<script type="text/javascript">
    $(document).ready(function () {
        var html = $(".wrap ul").html()
        $(".wrap ul").append(html)
        var ls = $(".wrap li").length / 2 + 1
        i = 0
        ref = setInterval(function () {
            i++
            if (i == ls) {
                i = 1
                $(".wrap ul").css({marginTop: 0})
                $(".wrap ul").animate({marginTop: -'.52' * i + 'rem'}, 1000)
            }
            $(".wrap ul").animate({marginTop: -'.52' * i + 'rem'}, 1000)


        }, 2400);


        var html2 = $(".adduser ul").html()
        $(".adduser ul").append(html2)
        var ls2 = $(".adduser li").length / 2 + 1
        a = 0
        ref = setInterval(function () {
            a++
            if (a == ls2) {
                a = 1
                $(".adduser ul").css({marginTop: 0})
                $(".adduser ul").animate({marginTop: -'.5' * a + 'rem'}, 800)
            }
            $(".adduser ul").animate({marginTop: -'.5' * a + 'rem'}, 800)


        }, 4300);

        function getWeekDay(date) {
            const weekDays = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
            return weekDays[date.getDay()];
        }

        function formatTime(time) {
            return time < 10 ? `0${time}` : time.toString();
        }

        function updateTime() {
            const now = new Date();
            const year = now.getFullYear();
            const month = formatTime(now.getMonth() + 1);
            const day = formatTime(now.getDate());
            const hours = formatTime(now.getHours());
            const minutes = formatTime(now.getMinutes());
            const seconds = formatTime(now.getSeconds());
            const weekDay = getWeekDay(now);

            const timeString = `${year}年${month}月${day}日 ${hours}:${minutes}:${seconds} ${weekDay}`;

            document.getElementById('time').innerText = timeString;
        }

        // 立即执行一次
        updateTime();

        // 每秒更新一次时间
        setInterval(updateTime, 1000);

        function fetchData() {
            fetch('/echarts/carousel')
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`HTTP error! Status: ${response.status}`);
                    }
                    return response.json();
                })
                .then(data => {
                    const listElement = document.getElementById('list');
                    listElement.innerHTML = ''; // 清空原有列表项

                    // 输出数据，方便调试
                    console.log('Received data:', data);

                    if (Array.isArray(data) && data.length > 0) {
                        data.forEach(item => {
                            const listItem = document.createElement('li');
                            const p1 = document.createElement('p');
                            const p2 = document.createElement('p');
                            const p3 = document.createElement('p');

                            p1.textContent = item.orderId;
                            p2.textContent = item.executingProcedureId;
                            p3.textContent = item.updateTime;

                            listItem.appendChild(p1);
                            listItem.appendChild(p2);
                            listItem.appendChild(p3);

                            listElement.appendChild(listItem);
                        });
                        var html = $(".wrap ul").html()
                        $(".wrap ul").append(html)
                    } else {
                        console.error('No data received');
                    }
                })
                .catch(error => console.error('Error:', error));
        }


        // 初始化加载数据
        fetchData();

        // 如果需要定期更新数据

    })


</script>

<script type="text/javascript">
    var myChart = echarts.init(document.getElementById('echarts4'));
    var plantCap = [{
        name: '工业',
        value: '222'
    }, {
        name: '农业',
        value: '115'
    }, {
        name: '互联网',
        value: '113'
    }, {
        name: '医疗',
        value: '95'
    }, {
        name: '文学',
        value: '92'
    }, {
        name: '服装',
        value: '87'
    }];
    var datalist = [{
        offset: [56, 48],
        symbolSize: 110,
        // opacity: .95,
        color: 'rgba(73,188,247,.14)',

    }, {

        offset: [30, 70],
        symbolSize: 70,
        color: 'rgba(73,188,247,.14)'
    }, {
        offset: [0, 43],
        symbolSize: 60,
        color: 'rgba(73,188,247,.14)'

    }, {
        offset: [93, 30],
        symbolSize: 70,
        color: 'rgba(73,188,247,.14)'
    }, {
        offset: [26, 19],
        symbolSize: 65,
        color: 'rgba(73,188,247,.14)'
    }, {
        offset: [75, 75],
        symbolSize: 60,
        color: 'rgba(73,188,247,.14)'

    }];

    var datas = [];
    for (var i = 0; i < plantCap.length; i++) {
        var item = plantCap[i];
        var itemToStyle = datalist[i];
        datas.push({
            name: item.value + '\n' + item.name,
            value: itemToStyle.offset,
            symbolSize: itemToStyle.symbolSize,
            label: {
                normal: {
                    textStyle: {
                        fontSize: 14
                    }
                }
            },

            itemStyle: {
                normal: {
                    color: itemToStyle.color,
                    opacity: itemToStyle.opacity
                }
            },
        })
    }
    option = {
        grid: {
            show: false,
            top: 10,
            bottom: 10
        },

        xAxis: [{
            gridIndex: 0,
            type: 'value',
            show: false,
            min: 0,
            max: 100,
            nameLocation: 'middle',
            nameGap: 5
        }],

        yAxis: [{
            gridIndex: 0,
            min: 0,
            show: false,
            max: 100,
            nameLocation: 'middle',
            nameGap: 30
        }],
        series: [{
            type: 'scatter',
            symbol: 'circle',
            symbolSize: 120,
            label: {
                normal: {
                    show: true,
                    formatter: '{b}',
                    color: '#FFF',
                    textStyle: {
                        fontSize: '30'
                    }
                },
            },
            itemStyle: {
                normal: {
                    color: '#F30'
                }
            },
            data: datas
        }]

    };
    myChart.setOption(option);
    $(document).ready(function () {
        myChart.resize();

    })
    window.addEventListener("resize", function () {
        myChart.resize();
    });
</script>
