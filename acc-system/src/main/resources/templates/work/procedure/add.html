<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:include="include :: header('新增工序管理')"/>
</head>
<body class="white-bg">
<div class="wrapper wrapper-content animated fadeInRight ibox-content">
    <form class="form-horizontal m" id="form-procedure-add">
                        <div class="col-xs-12">
                            <div class="form-group">
                                <label class="col-sm-3 control-label">物料号
                                    ：</label>
                                <div class="col-sm-8">
                                    <input name="materialId" class="form-control" type="text">
                                </div>
                            </div>
                        </div>
                        <div class="col-xs-12">
                            <div class="form-group">
                                <label class="col-sm-3 control-label">物料描述
                                    ：</label>
                                <div class="col-sm-8">
                                    <input name="description" class="form-control" type="text">
                                </div>
                            </div>
                        </div>
                        <div class="col-xs-12">
                            <div class="form-group">
                                <label class="col-sm-3 control-label">工序号
                                    ：</label>
                                <div class="col-sm-8">
                                    <input name="operationId" class="form-control" type="text">
                                </div>
                            </div>
                        </div>
                        <div class="col-xs-12">
                            <div class="form-group">
                                <label class="col-sm-3 control-label">加工中心
                                    ：</label>
                                <div class="col-sm-8">
                                    <input name="workCenter" class="form-control" type="text">
                                </div>
                            </div>
                        </div>
                        <div class="col-xs-12">
                            <div class="form-group">
                                <label class="col-sm-3 control-label">工序描述
                                    ：</label>
                                <div class="col-sm-8">
                                    <input name="operationDescription" class="form-control" type="text">
                                </div>
                            </div>
                        </div>
                        <div class="col-xs-12">
                            <div class="form-group">
                                <label class="col-sm-3 control-label">准备工时
                                    ：</label>
                                <div class="col-sm-8">
                                    <input name="setupTime" class="form-control" type="text">
                                </div>
                            </div>
                        </div>
                        <div class="col-xs-12">
                            <div class="form-group">
                                <label class="col-sm-3 control-label">加工工时
                                    ：</label>
                                <div class="col-sm-8">
                                    <input name="machineTime" class="form-control" type="text">
                                </div>
                            </div>
                        </div>
                        <div class="col-xs-12">
                            <div class="form-group">
                                <label class="col-sm-3 control-label">人工工时
                                    ：</label>
                                <div class="col-sm-8">
                                    <input name="laborTime" class="form-control" type="text">
                                </div>
                            </div>
                        </div>
    </form>
</div>
<th:block th:include="include :: footer"/>
<script th:inline="javascript">
    var prefix = ctx + "system/procedure"
    $("#form-procedure-add").validate({
        focusCleanup: true
    });

    function submitHandler() {
        if ($.validate.form()) {
            $.operate.save(prefix + "/add", $('#form-procedure-add').serialize());
        }
    }
</script>
</body>
</html>
