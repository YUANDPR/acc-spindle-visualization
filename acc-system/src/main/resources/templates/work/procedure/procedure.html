<!DOCTYPE html>
<html lang="zh" xmlns:shiro="http://www.pollix.at/thymeleaf/shiro" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:include="include :: header('工序管理列表')"/>
</head>
<body class="gray-bg">
<div class="container-div">
    <div class="row">
        <div class="col-sm-12 search-collapse">
            <form id="formId">
                <div class="select-list">
                    <ul>
                        <li>
                            <label>物料号：</label>
                            <input name="materialId" type="text"/>
                        </li>
                        <li>
                            <label>物料描述：</label>
                            <input name="description" type="text"/>
                        </li>
                        <li>
                            <label>工序号：</label>
                            <input name="operationId" type="text"/>
                        </li>
                        <li>
                            <label>加工中心：</label>
                            <input name="workCenter" type="text"/>
                        </li>
                        <li>
                            <label>工序描述：</label>
                            <input name="operationDescription" type="text"/>
                        </li>
                        <li>
                            <label>准备工时：</label>
                            <input name="setupTime" type="text"/>
                        </li>
                        <li>
                            <label>加工工时：</label>
                            <input name="machineTime" type="text"/>
                        </li>
                        <li>
                            <label>人工工时：</label>
                            <input name="laborTime" type="text"/>
                        </li>
                        <li>
                            <a class="btn btn-primary btn-rounded btn-sm" onclick="$.table.search()"><i
                                    class="fa fa-search"></i>&nbsp;搜索</a>
                            <a class="btn btn-warning btn-rounded btn-sm" onclick="$.form.reset()"><i
                                    class="fa fa-refresh"></i>&nbsp;重置</a>
                        </li>
                    </ul>
                </div>
            </form>
        </div>

        <div class="btn-group-sm" id="toolbar" role="group">
            <a class="btn btn-success" onclick="$.operate.add()" shiro:hasPermission="system:procedure:add">
                <i class="fa fa-plus"></i> 添加
            </a>
            <a class="btn btn-primary single disabled" onclick="$.operate.edit()"
               shiro:hasPermission="system:procedure:edit">
                <i class="fa fa-edit"></i> 修改
            </a>
            <a class="btn btn-danger multiple disabled" onclick="$.operate.removeAll()"
               shiro:hasPermission="system:procedure:remove">
                <i class="fa fa-remove"></i> 删除
            </a>
            <a class="btn btn-warning" onclick="$.table.exportExcel()" shiro:hasPermission="system:procedure:export">
                <i class="fa fa-download"></i> 导出
            </a>
        </div>
        <div class="col-sm-12 select-table table-striped">
            <table id="bootstrap-table"></table>
        </div>
    </div>
</div>
<th:block th:include="include :: footer"/>
<script th:inline="javascript">
    var editFlag = [[${@permission.hasPermi('system:procedure:edit')}]];
    var removeFlag = [[${@permission.hasPermi('system:procedure:remove')}]];
    var prefix = ctx + "system/procedure";

    $(function () {
        var options = {
            url: prefix + "/list",
            createUrl: prefix + "/add",
            updateUrl: prefix + "/edit/{id}",
            removeUrl: prefix + "/remove",
            exportUrl: prefix + "/export",
            modalName: "工序管理",
            columns: [{
                checkbox: true
            },
                {
                    field: 'id',
                    title: '主键',
                    visible: false
                },
                {
                    field: 'materialId',
                    title: '物料号'
                },
                {
                    field: 'description',
                    title: '物料描述'
                },
                {
                    field: 'operationId',
                    title: '工序号'
                },
                {
                    field: 'workCenter',
                    title: '加工中心'
                },
                {
                    field: 'operationDescription',
                    title: '工序描述'
                },
                {
                    field: 'setupTime',
                    title: '准备工时'
                },
                {
                    field: 'machineTime',
                    title: '加工工时'
                },
                {
                    field: 'laborTime',
                    title: '人工工时'
                },
                {
                    title: '操作',
                    align: 'center',
                    formatter: function (value, row, index) {
                        var actions = [];
                        actions.push('<a class="btn btn-success btn-xs ' + editFlag + '" href="javascript:void(0)" onclick="$.operate.edit(\'' + row.id + '\')"><i class="fa fa-edit"></i>编辑</a> ');
                        actions.push('<a class="btn btn-danger btn-xs ' + removeFlag + '" href="javascript:void(0)" onclick="$.operate.remove(\'' + row.id + '\')"><i class="fa fa-remove"></i>删除</a>');
                        return actions.join('');
                    }
                }]
        };
        $.table.init(options);
    });
</script>
</body>
</html>
