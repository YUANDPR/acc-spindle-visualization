<!DOCTYPE html>
<html lang="zh" xmlns:shiro="http://www.pollix.at/thymeleaf/shiro" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:include="include :: header('文件上传')"/>
    <th:block th:include="include :: bootstrap-fileinput-css"/>
</head>
<body class="gray-bg">
<div class="wrapper wrapper-content animated fadeInRight">
    <div class="row">
        <div class="col-sm-12">
            <div class="ibox float-e-margins">
                <div class="ibox-content" shiro:hasPermission="work:order:edit">
                    <div class="form-group">
                        <label class="font-bold">工单文件上传</label>
                        <div class="file-loading">
                            <input id="orderFile" name="file" type="file">
                        </div>
                    </div>
                </div>
                <hr/>
                <div class="ibox-content" shiro:hasPermission="work:process:edit">
                    <div class="form-group">
                        <label class="font-bold">工序文件上传</label>
                        <div class="file-loading">
                            <input id="processFile" name="file" type="file">
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<th:block th:include="include :: footer"/>
<th:block th:include="include :: bootstrap-fileinput-js"/>
<script th:inline="javascript">

    $(document).ready(function () {
        // 工单上传
        $("#orderFile").fileinput({
            language: 'zh',
            uploadUrl: ctx + 'tool/work/order',
            showPreview: true,
            maxFileCount: 1,
            autoReplace: true,
            dropZoneTitle: '请将工单文件拖拽到这里',
            allowedFileExtensions: ['xls', 'xlsx'], // 允许上传的文件类型
            msgInvalidFileExtension: '只能上传xls或xlsx文件，请重新上传！', // 文件类型验证失败的消息
        }).on('fileuploaded', function (event, data, previewId, index) {
            var rsp = data.response;
            console.log(rsp)
            if (rsp.msg === '操作成功') {
                $.modal.alertSuccess("文件上传成功！");
            } else {
                $.modal.alertError(rsp.msg);
            }
            log.info("return url：" + rsp.url)
            log.info("reutrn fileName：" + rsp.fileName)
            log.info("reutrn newFileName：" + rsp.newFileName)
            log.info("return originalFilename：" + rsp.originalFilename)
        }).on('fileremoved', function (event, id, index) {
            $("input[name='" + event.currentTarget.id + "']").val('')
        }).on('change', function (event) {
            $.modal.alertWarning("新工单将会覆盖旧工单，请谨慎上传！");
        })

        // 工序上传
        $("#processFile").fileinput({
            showPreview: true,
            uploadUrl: ctx + 'tool/work/process',
            maxFileCount: 1,
            autoReplace: true,
            dropZoneTitle: "请将工序文件拖拽到这里",
            allowedFileExtensions: ['xls', 'xlsx'], // 允许上传的文件类型
            msgInvalidFileExtension: '只能上传xls或xlsx文件，请重新上传！', // 文件类型验证失败的消息
        }).on('fileuploaded', function (event, data, previewId, index) {
            var rsp = data.response;
            console.log(rsp)
            if (rsp.msg === "操作成功") {
                $.modal.alertSuccess("文件上传成功！");
            } else {
                $.modal.alertError(rsp.msg);
            }
            log.info("return url：" + rsp.url)
            log.info("reutrn fileName：" + rsp.fileName)
            log.info("reutrn newFileName：" + rsp.newFileName)
            log.info("return originalFilename：" + rsp.originalFilename)
        }).on('fileremoved', function (event, id, index) {
            $("input[name='" + event.currentTarget.id + "']").val('')
        }).on('change', function (event) {
            $.modal.alertWarning("新工序将会覆盖旧工序，请谨慎上传！");
        })


    });
</script>
</body>
</html>
